name: regression-gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest      # sin GPU: NUNCA transcribe, solo recalcula metricas desde results/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q tests -k "not engine_has_no_ui"
      - run: python scripts/run_eval.py --gate
