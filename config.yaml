# Toda ruta, modelo, umbral y prompt vive aqui. Credenciales en .env (nunca en el repo).

paths:
  audio_dir: data/audio                 # no se versiona (ver README: como regenerar)
  synthetic_dir: data/synthetic         # grupo aparte, nunca mezclado con el corpus real
  ladder_dir: data/audio_ladder
  ground_truth:
    interviews: data/ground_truth/interviews.yaml
    calls: data/ground_truth/calls.yaml
  cache_dir: results/cache              # transcripciones cacheadas (SI se versionan)
  results_dir: results
  env_file: .env

asr:
  model: small                          # tiny | base | small | medium | large-v3
  device: auto                          # auto | cuda | cpu
  compute_type: auto                    # auto -> float16 en cuda, int8 en cpu
  language: es
  beam_size: 5
  vad_filter: true
  word_timestamps: true                 # necesario para la confianza por palabra
  glossary_mode: none                   # none | hotwords | initial_prompt
  benchmark:
    models: [small, medium]             # >= 2 tamanos (en Colab agregar large-v3)
    compute_types_gpu: [float16, int8_float16]
    compute_types_cpu: [int8]
    repeat: 1

normalization:
  # Misma regla para referencia e hipotesis antes de WER/CER:
  lowercase: true
  strip_accents: true
  strip_punctuation: true
  numbers_to_digits: true               # "seis mil quinientos" == "6500" == "6.500"
  collapse_whitespace: true

reference_date: "2026-10-26"            # fecha de grabacion; ancla de "en dos semanas"

metrics:
  bootstrap_resamples: 2000
  ci_level: 0.95
  seed: 7
  text_match_threshold: 0.85            # similitud difflib para campos de texto libre
  numeric_tolerance: 0.01

extraction:
  default_extractor: rules              # rules | llm
  llm:
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 1200
    temperature: 0
    api_key_env: ANTHROPIC_API_KEY
  verification:
    unverified_label: sin_verificar

# ---------------------------------------------------------------- Esquemas
schemas:
  interview:
    fields:
      anios_experiencia: {type: numeric}
      ultimo_puesto: {type: text}
      tecnologias: {type: list}
      pretension_salarial: {type: numeric_currency}
      disponibilidad: {type: date}
      nivel_ingles: {type: categorical, classes: [basico, intermedio, avanzado]}
    glossary:
      - Python
      - SQL
      - Power BI
      - Airflow
      - Django
      - Docker
      - Kubernetes
      - AWS
      - Git
      - React
      - TypeScript
      - Figma
      - Spark
      - Kafka
      - Tableau
      - FastAPI
      - Node
      - Excel
    english_keywords:
      basico: [basico, principiante, elemental]
      intermedio: [intermedio]
      avanzado: [avanzado, fluido, nativo, bilingue]
    currencies:
      PEN: [sol, soles, pen, "s/"]
      USD: [dolar, dolares, usd, "$"]
    llm_prompt: |
      Eres un extractor de datos para entrevistas de trabajo en espanol. Recibes la
      transcripcion de una entrevista (dos voces: entrevistador y candidato).
      Devuelve SOLO un JSON valido con estas claves, y para cada una el objeto
      {"valor": ..., "evidencia": "<fragmento LITERAL copiado de la transcripcion>"}:
        anios_experiencia (numero), ultimo_puesto (texto), tecnologias (lista de textos),
        pretension_salarial ({"monto": numero, "moneda": "PEN"|"USD"}),
        disponibilidad (texto tal como se dijo, ej. "en dos semanas"),
        nivel_ingles ("basico"|"intermedio"|"avanzado").
      La evidencia debe copiarse tal cual aparece en la transcripcion. No corrijas
      lo que creas que el reconocedor oyo mal. Si un dato no aparece, usa valor null.

  order:
    domain: restaurante                 # dominio elegido: polleria (restaurante)
    fields:
      items: {type: items}
      promocion: {type: promo}
      direccion_entrega: {type: text}
      metodo_pago: {type: categorical, classes: [efectivo, tarjeta, yape]}
      total_dicho: {type: numeric}
    menu:
      pollo a la brasa: {sizes: [medio, entero]}
      porcion de papas fritas: {sizes: [personal, familiar]}
      chicha morada: {sizes: [vaso, jarra]}
      gaseosa: {sizes: [personal, litro]}
    fuzzy_match_threshold: 0.5          # parecido minimo (difflib) para reconocer un producto/tamano mal oido por el ASR
    payment_keywords:
      efectivo: [efectivo, cash, billete]
      tarjeta: [tarjeta, visa, mastercard, debito, credito]
      yape: [yape, plin]
    # Pares de numeros que un ASR confunde por sonido (para diagnosticar el desajuste)
    confusable_numbers:
      - [13, 30]
      - [14, 40]
      - [15, 50]
      - [16, 60]
      - [17, 70]
      - [18, 80]
      - [19, 90]
      - [60, 70]
      - [80, 90]
      - [40, 50]
    diagnosis:
      low_confidence_threshold: 0.60    # prob. de palabra numerica bajo la cual se sospecha del ASR
    llm_prompt: |
      Eres un extractor de datos para llamadas de pedido de una polleria en espanol.
      Recibes la transcripcion de una llamada (operador y cliente). El cliente puede
      corregirse: conserva SOLO el pedido final. Devuelve SOLO un JSON valido con:
        items: lista de {"producto","tamano","cantidad","precio_unitario","evidencia"},
        promocion: {"tipo":"monto"|"porcentaje","valor":numero,"evidencia":"..."} o null,
        direccion_entrega: {"valor":"...","evidencia":"..."},
        metodo_pago: {"valor":"efectivo"|"tarjeta"|"yape","evidencia":"..."},
        total_dicho: {"valor": numero, "evidencia":"..."}.
      Cada evidencia es un fragmento LITERAL de la transcripcion. No recalcules el total:
      reporta el que dijo el operador, aunque este mal. Si falta un dato, usa null.

validation:
  tolerance: 0.5                        # soles; cubre redondeo de descuentos porcentuales

ladder:
  levels: [L0, L1, L2, L3]
  l1: {codec: libopus, bitrate: 16k, channels: 1, sample_rate: 16000}   # nota de voz de WhatsApp
  l2: {highpass_hz: 300, lowpass_hz: 3400, sample_rate: 8000}           # llamada telefonica
  l3:
    base: L1
    snr_db: 10        # ver README: 10 dB = calle/cafeteria ruidosa; 0 dB es voz = ruido
    noise: pink       # ruido rosa sintetico, semilla fija -> reproducible
    seed: 11
    active_frame_db_below_peak: 30   # solo se mide la potencia de voz en tramos activos

app:
  results_file: results/summary.json
  title: "De la voz al registro"

synthetic:                              # SOLO aumento opcional; grupo separado, nunca en los numeros principales
  voice_a: es-PE-AlexNeural
  voice_b: es-PE-CamilaNeural
  pause_s: 0.4
  accent_voices:                        # eje de acento (innovacion): mismos guiones, voces sinteticas de varios paises
    es-PE: [es-PE-AlexNeural, es-PE-CamilaNeural]
    es-MX: [es-MX-JorgeNeural, es-MX-DaliaNeural]
    es-AR: [es-AR-TomasNeural, es-AR-ElenaNeural]
    es-ES: [es-ES-AlvaroNeural, es-ES-ElviraNeural]

gate:                                   # puerta de regresion (GitHub Actions, sobre transcripciones cacheadas)
  max_wer: 0.25
  min_field_acc: 0.60
