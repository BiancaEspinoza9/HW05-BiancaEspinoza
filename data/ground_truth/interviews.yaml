# Tarea 1 - Entrevistas. TODO es inventado (nombres, empresas, cifras). A = entrevistador, B = candidato/a.
# El guion se escribe ANTES de grabar; la transcripcion de referencia sale de aqui (sin etiquetas A:/B:).
# Lectura natural, con pausas. No improvisar: cualquier cambio al leer debe reflejarse en el guion.
- id: E01
  candidato: Camila (inventada)
  fecha_referencia: "2026-10-26"
  orden_campos: [anios_experiencia, ultimo_puesto, tecnologias, nivel_ingles, pretension_salarial, disponibilidad]
  guion: |
    A: Buenos días, Camila. Gracias por venir. Antes de empezar, cuéntame brevemente quién eres.
    B: Buenos días. Soy analista de datos y me gusta convertir números en decisiones. Tengo cuatro años de experiencia trabajando con información de ventas y de logística.
    A: Muy bien. ¿Cuál fue tu último puesto?
    B: Mi último puesto fue analista de inteligencia comercial en una empresa de consumo masivo. Armaba tableros semanales para la gerencia y revisaba por qué cambiaban las ventas de una región a otra.
    A: Interesante. ¿Y qué herramientas usas en tu día a día?
    B: Trabajo sobre todo con Python y SQL para limpiar y consultar los datos. Para los tableros uso Power BI, y también he usado Airflow para programar los procesos que se repiten cada noche.
    A: Perfecto. Esa combinación nos sirve mucho. Cuéntame de un proyecto del que estés orgullosa.
    B: Claro. Automaticé el reporte de devoluciones de tienda. Antes lo armaba una persona a mano durante casi todo un día. Ahora se genera solo, llega al correo temprano y los errores bajaron bastante.
    A: Qué buen resultado. Esta empresa trabaja con proveedores de varios países, ¿cómo está tu inglés?
    B: Mi nivel de inglés es intermedio. Puedo leer documentación sin problema y mantener una reunión, pero todavía me cuesta improvisar una presentación completa.
    A: Está bien, tenemos un curso interno para eso. Hablemos ahora de lo económico. ¿Cuál es tu pretensión salarial?
    B: Estoy buscando seis mil quinientos soles mensuales, de acuerdo con lo que he investigado para este tipo de puesto.
    A: Entiendo. Y para incorporarte, ¿cuándo estarías disponible?
    B: Tengo que cumplir con el preaviso en mi trabajo actual, así que podría empezar en dos semanas.
    A: Perfecto. ¿Tienes alguna pregunta para nosotros?
    B: Sí, me gustaría saber cómo es el equipo con el que trabajaría y qué tan seguido se presentan resultados a la gerencia.
    A: Son siete personas y se presenta cada mes, con apoyo del jefe de área. Gracias por tu tiempo, Camila. Te escribiremos esta semana con una respuesta.
    B: Muchas gracias a ustedes. Fue un gusto conversar.
  campos:
    anios_experiencia: 4
    ultimo_puesto: analista de inteligencia comercial
    tecnologias: [Python, SQL, Power BI, Airflow]
    pretension_salarial: {monto: 6500, moneda: PEN}
    disponibilidad: "2026-11-09"
    nivel_ingles: intermedio

- id: E02
  candidato: Diego (inventado)
  fecha_referencia: "2026-10-26"
  orden_campos: [disponibilidad, pretension_salarial, anios_experiencia, ultimo_puesto, tecnologias, nivel_ingles]
  guion: |
    A: Buenas tardes, Diego. Empecemos por lo práctico, porque sé que tienes otra entrevista hoy. ¿Cuándo podrías incorporarte, si todo sale bien?
    B: Buenas tardes. Puedo incorporarme de inmediato. Terminé mi contrato anterior hace unas semanas y estoy libre.
    A: Excelente. Y en cuanto a lo económico, ¿qué pretensión salarial tienes?
    B: Busco dos mil quinientos dólares al mes, ya que es un puesto con bastante responsabilidad.
    A: Entendido. Ahora cuéntame de tu trayectoria. ¿Cuánta experiencia tienes?
    B: Tengo siete años y medio de experiencia en desarrollo de software, casi todo en el lado del servidor. Empecé en una consultora pequeña y luego pasé a una empresa de pagos en línea.
    A: ¿Cuál fue tu último puesto allí?
    B: Fui desarrollador backend senior. Me encargaba de diseñar servicios para procesar pagos y de revisar el código de los compañeros más nuevos.
    A: ¿Con qué tecnologías trabajabas?
    B: Programaba con Django, y todo lo empaquetábamos con Docker. La infraestructura estaba en AWS, y para el control de versiones usábamos Git todos los días.
    A: Suena muy completo. ¿Qué fue lo más difícil de ese trabajo?
    B: Mantener el sistema estable en días de mucha demanda. Una vez tuvimos una caída por exceso de usuarios y aprendimos a repartir mejor la carga entre los servidores. Desde entonces hicimos pruebas de carga antes de cada campaña.
    A: Eso es justo lo que necesitamos aquí. Una última cosa: nuestros clientes están en varios países. ¿Cómo está tu inglés?
    B: Tengo un inglés avanzado. He dado presentaciones técnicas a clientes de otros países y no he tenido problemas.
    A: Muy bien, Diego. Gracias por venir. Nos comunicaremos pronto.
    B: Gracias a ustedes. Quedo atento.
  campos:
    anios_experiencia: 7.5
    ultimo_puesto: desarrollador backend senior
    tecnologias: [Django, Docker, AWS, Git]
    pretension_salarial: {monto: 2500, moneda: USD}
    disponibilidad: "2026-10-26"
    nivel_ingles: avanzado

- id: E03
