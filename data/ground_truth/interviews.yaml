    B: Hola, gracias. Trabajo principalmente con React y TypeScript para las interfaces. Uso Git para el control de versiones y Figma cuando tengo que revisar diseños con el equipo.
    A: ¿Cómo llegaste a programar interfaces?
    B: Estudié diseño gráfico y descubrí que me gustaba más implementar los diseños que dibujarlos. Hice un curso intensivo de programación y de ahí empecé a buscar trabajo.
    A: Y de ese trabajo, ¿cuál fue tu último puesto?
    B: Mi último puesto fue desarrolladora frontend en una agencia de publicidad. Construía páginas para campañas de marcas de ropa y de bebidas.
    A: ¿Cuánto tiempo llevas en esto?
    B: Llevo dos años trabajando como desarrolladora. Antes de eso hice un año en prácticas, pero ese tiempo no lo cuento como experiencia formal.
    A: Entiendo. ¿Y qué te cuesta más hoy?
    B: Me cuesta explicar decisiones técnicas ante personas que no programan, pero estoy practicando con presentaciones cortas.
    A: Muy bien. Un detalle importante: algunos documentos que usamos están en inglés. ¿Qué nivel tienes?
    B: Mi inglés es básico. Puedo leer mensajes de error y documentación sencilla, pero todavía no converso con fluidez.
